# The exe, built on demand and handed over as an artifact. Nothing runs on every push:
# the build is started by hand, and the release number is typed into the form.
name: Build xebuild

on:
  workflow_dispatch:
    inputs:
      release:
        description: "release number, numbers separated by dots, e.g. 0.1 or 0.1.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  exe:
    name: xebuild ${{ inputs.release }}, windows x64
    runs-on: windows-latest
    env:
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # pyproject.toml asks for 3.14 or newer, and Nuitka compiles the version it
          # is given, so the exe carries this one.
          python-version: "3.14"
          architecture: "x64"

      - name: the release number
        shell: bash
        run: |
          # Nuitka's --file-version takes up to four numbers and nothing else; the
          # zeros it adds on Windows are its own business.
          if [[ ! "$RELEASE" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            printf "release must be up to four numbers separated by dots, got '%s'\n" \
              "$RELEASE" >&2
            exit 1
          fi

      - name: install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka
          python -m pip install .

      - name: the entry point
        shell: bash
        run: |
          # Nuitka is given a file to compile, and xebuild/cli/__main__.py is not one
          # it can be given: that file is run as `python -m xebuild.cli`, so its
          # import is relative, and a script compiled on its own has no package to be
          # relative to. What it does is the three lines below.
          mkdir -p launcher dist
          printf '%s\n' \
            'import sys' \
            '' \
            'from xebuild.cli import main' \
            '' \
            'sys.exit(main(sys.argv[1:]))' \
            > launcher/xebuild_main.py

      - name: compile
        shell: bash
        run: |
          # onefile is the whole Python, the whole stdlib and the whole package in one
          # exe: nothing beside it is needed to run it, and it is the artifact as it
          # stands. The two loaders are named here because Nuitka counts a .bin as a
          # binary and not as data, so --include-package-data leaves them out; they
          # have to arrive in the dist where jtag/loaders.py looks for them, which is
          # the same place pyproject.toml's package-data puts them for an install.
          # Nuitka also scans every argument for a '-c' or a '-m' and refuses to start
          # when it finds one, on the thought that a program given those is a Python
          # asked to execute itself, and a compiled one would go on doing it forever.
          # Build mode's console switch is '-c', so the guard ended the exe before it
          # had read anything: measured, both '-c trinity' and '-t glitch -c trinity
          # ...' stopped in that refusal. The guard is compiled out here, which is
          # what its own message asks for; '--deployment' would take out the rest of
          # Nuitka's checks as well.
          python -m nuitka \
            --mode=onefile \
            --msvc=latest \
            --assume-yes-for-downloads \
            --no-deployment-flag=self-execution \
            --include-package=xebuild \
            --include-data-files=src/xebuild/jtag/builtin=xebuild/jtag/builtin/=**/*.bin \
            --file-version="$RELEASE" \
            --product-version="$RELEASE" \
            --product-name=xebuild \
            --file-description="A NAND image builder for the Xbox 360" \
            --output-filename=dist/xeBuild.exe \
            --remove-output \
            launcher/xebuild_main.py

      - name: run it
        shell: bash
        run: |
          # What runs here is the compiled program itself, on build mode's own `-?`,
          # which prints the help and ends with 0: an exe that cannot print it did
          # not get built whole. The name it is given is the original's own, the one
          # jrunner looks for under its own directory and the one a `-d data` beside
          # it is measured against.
          ls -l dist
          ./dist/xeBuild.exe -\? > "$RUNNER_TEMP/help.txt"
          head -n 3 "$RUNNER_TEMP/help.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: xebuild-${{ inputs.release }}-win-x64
          path: dist/xeBuild.exe
          if-no-files-found: error
          # The onefile payload is already compressed, so zipping it again spends
          # the runner's time for nothing.
          compression-level: 0
