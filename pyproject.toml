[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xebuild"
version = "0.1.0"
description = "A NAND image builder for the Xbox 360"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The two loaders the original carries inside itself for a JTAG image.
"xebuild.jtag" = ["builtin/*.bin"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Two families are left out on measurement rather than taste. `UP031` -- rewrite `%`
# formatting as f-strings -- was 24 of the 25 findings over this tree, and the project
# writes `%` throughout. `TRY003` objects to messages that say what went wrong, which
# every refusal here does on purpose, and `TRY004` wants a TypeError where an option was
# named with no value after it, which is a missing value and not a wrong type.
# `I` (isort) is left out because the project orders its imports its own way:
# `from __future__` first, then the `import` lines shortest first, then the `from` lines
# shortest first, with one module's names packed into as few lines as fit, and no
# parentheses.
select = ["E", "W", "F", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A package's `__init__.py` re-exports on purpose, so every name in it reads as unused.
"**/__init__.py" = ["F401"]

[project.scripts]
xebuild = "xebuild.cli:main"
